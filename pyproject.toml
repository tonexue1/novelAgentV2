[project]
name = "story-engine"
version = "0.0.1"
description = "受控递推的 AI 长篇小说 / 短剧生成——记忆与生产系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-ulid>=2.0",
    "tiktoken>=0.7",       # 精确 token 计数（Retriever 预算 / Chunker）
    "rank-bm25>=0.2",      # 词法相关性打分（Retriever 规则版）
]

[project.optional-dependencies]
openai = [
    "openai>=1.30",
    "instructor>=1.0",   # 开源结构化输出：schema 注入 + 校验失败带报错重试（M2 选型）
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["story_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
